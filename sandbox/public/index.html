<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes</title>
<body style="font: 16px/1.5 system-ui, sans-serif; max-width: 32rem; margin: 3rem auto; padding: 0 1rem">

<h1>Notes</h1>
<form><input name="text" placeholder="Write a note" required autofocus> <button>Add</button></form>
<ul></ul>

<script>
  const form = document.querySelector("form");

  async function load() {
    const notes = await (await fetch("/api/notes")).json();
    document.querySelector("ul").replaceChildren(...notes.map((note) => Object.assign(document.createElement("li"), { textContent: note.text })));
  }

  form.onsubmit = async (event) => {
    event.preventDefault();
    await fetch("/api/notes", { method: "POST", body: JSON.stringify({ text: form.text.value }) });
    form.reset();
    load();
  };

  load();
</script>
